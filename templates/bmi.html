<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <title>BMI 計算</title>
  <link rel="icon" href="{{ url_for('static', filename='bmi.png') }}" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 引入 zpix 字體 */
    @font-face {
      font-family: 'Zpix';
      src: url('/static/zpix.ttf') format('truetype');
    }

    body {
      font-family: 'Zpix', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
      /* 確保內容在背景之上 (雖然預設應該是這樣) */
      position: relative;
      z-index: 1;
    }

    /* --- 其他您原有的 CSS 樣式保持不變 --- */
    h2,
    h3 {
      color: #2e7d32;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input[type="number"] {
      padding: 10px;
      margin-top: 5px;
      width: 100%;
      max-width: 300px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
      /* 添加 box-sizing */
    }

    button {
      font-family: 'Zpix', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin-top: 25px;
      padding: 12px 24px;
      background: #4caf50;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    table {
      width: 100%;
      margin-top: 40px;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #4caf50;
      color: white;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    canvas {
      margin-top: 40px;
      background: #fff;
      /* 保持圖表背景色 */
      border-radius: 8px;
      /* 保持圖表圓角 */
      padding: 10px;
      /* 保持圖表內邊距 */
      box-sizing: border-box;
    }

    #backButton {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #2196f3;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease;
      z-index: 1000;
      /* 提高層級確保在背景之上 */
    }

    .delete-btn {
      background-color: #e53935;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    .delete-btn:hover {
      background-color: #c62828;
    }

    /* 滑鼠設定 */
    .cursor-container {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      width: 0;
      height: 0;
    }

    .cursor-container img {
      width: 40px;
      height: 40px;
      position: absolute;
      transform-origin: center center;
      image-rendering: pixelated;
    }

    /* --- 2. 貼上 home.html 的動態背景 CSS --- */
    .aurora-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      /* 確保在內容之下 */
      overflow: hidden;
      background-color: #f7f9fc;
      /* 背景底色 */
    }

    .aurora-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.6;
    }

    .shape-1 {
      background-color: #88ff96;
      width: 40vmin;
      height: 40vmin;
      top: 0;
      left: 0;
      animation: move-path-1 6s infinite alternate ease-in-out;
    }

    .shape-2 {
      background-color: #aaefff;
      width: 35vmin;
      height: 35vmin;
      top: 0;
      left: 50%;
      animation: move-path-2 5s infinite alternate ease-in-out 1s;
    }

    .shape-3 {
      background-color: #4CAF50;
      width: 45vmin;
      height: 45vmin;
      top: 0;
      right: 0;
      animation: move-path-3 7s infinite alternate ease-in-out;
    }

    .shape-4 {
      background-color: #c6ffcd;
      width: 30vmin;
      height: 30vmin;
      top: 50%;
      right: 0;
      animation: move-path-4 8s infinite alternate ease-in-out 2s;
    }

    .shape-5 {
      background-color: #4CAF50;
      width: 25vmin;
      height: 25vmin;
      bottom: 0;
      right: 0;
      animation: move-path-1 9s infinite alternate-reverse ease-in-out;
    }

    .shape-6 {
      background-color: #fdeff9;
      width: 30vmin;
      height: 30vmin;
      bottom: 0;
      left: 50%;
      animation: move-path-2 4s infinite alternate-reverse ease-in-out 1.5s;
    }

    @keyframes move-path-1 {
      from {
        transform: translate(-20%, -20%);
      }

      to {
        transform: translate(calc(100vw - 80%), calc(100vh - 80%));
      }
    }

    @keyframes move-path-2 {
      from {
        transform: translate(-50%, -20%);
      }

      to {
        transform: translate(-50%, calc(100vh - 80%));
      }
    }

    @keyframes move-path-3 {
      from {
        transform: translate(20%, -20%);
      }

      to {
        transform: translate(calc(-100vw + 120%), calc(100vh - 80%));
      }
    }

    @keyframes move-path-4 {
      from {
        transform: translate(20%, -50%);
      }

      to {
        transform: translate(calc(-100vw + 120%), -50%);
      }
    }

    /* --- 動態背景 CSS 結束 --- */

    /* --- ★ (新) 像素風返回按鈕樣式 ★ --- */

    /* 1. 定位容器 (取代原本 #backButton 的定位) */
    .game-back-button-container {
      position: fixed;
      top: 50px;
      right: 20px;
      z-index: 1001;
      /* 確保在最上層 */
    }

    .pixel-button {
      position: relative;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      /* ★ 使用 Zpix 字體 ★ */
      font-family: 'Zpix', sans-serif;
      font-size: 16px;
      /* 稍微調大字體 */
      image-rendering: pixelated;
      transition: all 0.1s ease;
    }

    .button-body {
      position: relative;
      /* 預設顏色：改為您原本的藍色系，或者保留像素風的橘色？這裡保留橘色更有遊戲感 */
      background: #35ff72;
      color: #fff;
      padding: 10px 20px;
      /* 調整內距 */
      border: 3px solid #000;
      box-shadow:
        inset 3px 3px 0px #5aff68,
        inset -3px -3px 0px #1acc26,
        3px 3px 0px #000,
        6px 6px 0px rgba(0, 0, 0, 0.3);
      text-shadow: 2px 2px 0px #000;
      z-index: 2;
      display: flex;
      align-items: center;
      font-weight: bold;
    }

    /* ★ 修改：彈出的 Home Icon (取代原本的 .coin) ★ */
    .pixel-home-icon {
      position: absolute;
      width: 30px;
      height: 30px;
      /* 設定背景圖為 home.png */
      background-image: url('/static/home.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;

      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      /* 預設隱藏 */
      z-index: 10;
      pointer-events: none;
    }

    .button-glow {
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      background: linear-gradient(45deg, #ff6b35, #ffd700, #35ff6b, #356bff, #ff35ff);
      border-radius: 6px;
      opacity: 0;
      z-index: 1;
      animation: rainbow-glow 0.5s ease-in-out infinite;
      /* 加上 infinite 讓它一直閃 */
      display: none;
      /* 預設隱藏，hover 時顯示 */
    }

    /* --- Hover 效果 --- */
    .pixel-button:hover .button-body {
      background: #35ff6b;
      /* Hover 變綠色 */
      box-shadow:
        inset 3px 3px 0px #5aff8c,
        inset -3px -3px 0px #1acc4a,
        3px 3px 0px #000,
        6px 6px 0px rgba(0, 0, 0, 0.3);
      transform: scale(1.05);
      color: #000;
      /* 綠底配黑字比較清楚 */
      text-shadow: none;
    }

    .pixel-button:hover .button-glow {
      opacity: 0.8;
      display: block;
    }

    /* ★ 觸發彈出動畫 ★ */
    .pixel-button:hover .pixel-home-icon {
      animation: home-pop-up 0.6s ease-out;
    }

    .pixel-button:active .button-body {
      background: #ff35ff;
      /* 點擊變紫色 */
      transform: translate(3px, 3px) scale(0.98);
      box-shadow:
        inset 3px 3px 0px #ff5aff,
        inset -3px -3px 0px #cc1acc,
        0px 0px 0px #000,
        3px 3px 0px rgba(0, 0, 0, 0.3);
      color: #fff;
      text-shadow: 2px 2px 0px #000;
    }

    /* 分數/文字彈出 */
    .score-popup {
      position: absolute;
      top: -20px;
      right: -10px;
      font-size: 12px;
      color: #ffd700;
      text-shadow: 1px 1px 0 #000;
      opacity: 0;
      pointer-events: none;
      font-family: 'Zpix', sans-serif;
    }

    .pixel-button:active .score-popup {
      animation: score-popup-anim 0.6s ease-out;
    }

    /* --- 動畫定義 --- */

    /* Icon 彈出動畫 */
    @keyframes home-pop-up {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(10px) scale(0.5);
      }

      50% {
        opacity: 1;
        transform: translateX(-50%) translateY(-25px) scale(1.2);
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-40px) scale(1);
      }
    }

    @keyframes score-popup-anim {
      0% {
        opacity: 0;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-15px);
      }

      100% {
        opacity: 0;
        transform: translateY(-30px);
      }
    }

    @keyframes rainbow-glow {
      0% {
        opacity: 0.5;
        filter: hue-rotate(0deg);
      }

      100% {
        opacity: 0.8;
        filter: hue-rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="aurora-background">
    <div class="aurora-shape shape-1"></div>
    <div class="aurora-shape shape-2"></div>
    <div class="aurora-shape shape-3"></div>
    <div class="aurora-shape shape-4"></div>
    <div class="aurora-shape shape-5"></div>
    <div class="aurora-shape shape-6"></div>
  </div>

  <div class="cursor-container">
    <img src="{{ url_for('static', filename='my-cursor.png') }}" />
  </div>

  <div class="game-back-button-container">
    <a href="/home" style="text-decoration: none;">
      <button class="pixel-button" type="button">
        <div class="button-glow"></div>
        <div class="button-body">
          <img src="{{ url_for('static', filename='home.png') }}" alt="icon"
            style="width: 20px; vertical-align: middle; margin-right:5px;">
          返回主畫面
        </div>
        <div class="pixel-home-icon"></div>
        <div class="score-popup">GO!</div>
      </button>
    </a>
  </div>
  <h2><img src="{{ url_for('static', filename='bmi.png') }}" alt="三角板圖示" width="20" height="20"
      style="vertical-align: middle;"> BMI 計算器</h2>
  <p id="status">登入狀態載入中...</p>
  <label>身高 (cm)<input type="number" id="height" min="50" max="300" required /></label>
  <label>體重 (kg)<input type="number" id="weight" min="10" max="300" required /></label>
  <button id="calculateBtn">計算並儲存 BMI</button>
  <p id="result"></p>

  <h3>歷史 BMI 紀錄</h3>
  <table>
    <thead>
      <tr>
        <th>日期</th>
        <th>時間</th>
        <th>身高</th>
        <th>體重</th>
        <th>BMI (分類)</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="recordListBody"></tbody>
  </table>

  <h3>BMI 趨勢圖</h3>
  <canvas id="bmiChart" width="700" height="350"></canvas>
  <script>
    const statusEl = document.getElementById('status');
    const idToken = sessionStorage.getItem('firebaseIdToken');
    let chartInstance = null;

    // --- API Helper ---
    async function apiFetch(endpoint, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      if (idToken) headers['Authorization'] = `Bearer ${idToken}`;
      const response = await fetch(endpoint, { ...options, headers });
      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error || `HTTP error! status: ${response.status}`);
      }
      if (response.status === 204 || response.headers.get('content-length') === '0') return null;
      return response.json();
    }

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', async () => {
      if (!idToken) {
        alert("請先登入！");
        window.location.href = "/login";
        return;
      }
      try {
        const profile = await apiFetch('/api/user-profile');
        statusEl.innerHTML = `<img src="{{ url_for('static', filename='person.png') }}" alt="人像圖示" width="20" height="20" style="vertical-align: middle;"> 已登入：${profile.email || '使用者'}`;
        await loadBMIRecords();
      } catch (e) {
        statusEl.textContent = '❌ 驗證失敗，請重新登入';
        console.error(e);
        sessionStorage.removeItem('firebaseIdToken');
        setTimeout(() => window.location.href = "/login", 1500);
      }
    });

    // --- Event Listeners ---
    document.getElementById('calculateBtn').addEventListener('click', calculateAndSaveBMI);
    document.getElementById('recordListBody').addEventListener('click', handleRecordDelete);

    // --- Core Functions ---
    async function calculateAndSaveBMI() {
      const height = parseFloat(document.getElementById('height').value);
      const weight = parseFloat(document.getElementById('weight').value);
      if (!height || !weight || height <= 0 || weight <= 0) {
        alert("請輸入正確的身高與體重！");
        return;
      }
      const bmi = weight / ((height / 100) ** 2);
      const roundedBMI = parseFloat(bmi.toFixed(2));
      document.getElementById('result').textContent = `你的 BMI 為：${roundedBMI} (${getBMICategory(roundedBMI)})`;

      const now = new Date();
      const dateStr = now.toLocaleDateString('zh-TW');
      const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });

      try {
        await apiFetch('/api/bmi-records', {
          method: 'POST',
          body: JSON.stringify({ height, weight, bmi: roundedBMI, date: dateStr, time: timeStr })
        });
        alert("✅ BMI 紀錄已儲存！");
        await loadBMIRecords();
      } catch (err) {
        alert(`❌ 儲存失敗：${err.message}`);
      }
    }

    async function loadBMIRecords() {
      try {
        const records = await apiFetch('/api/bmi-records');
        const listTbody = document.getElementById("recordListBody");

        records.sort((a, b) => {
          // 結合日期和時間進行比較
          const dateA = new Date(`${a.date.replace(/\//g, '-')} ${a.time}`);
          const dateB = new Date(`${b.date.replace(/\//g, '-')} ${b.time}`);
          return dateB - dateA; // 最新的在前面
        });

        listTbody.innerHTML = records.map(record => `
              <tr>
                <td>${record.date}</td>
                <td>${record.time}</td>
                <td>${record.height} cm</td>
                <td>${record.weight} kg</td>
                <td>${record.bmi} (${getBMICategory(record.bmi)})</td>
                <td><button class="delete-btn" data-id="${record.id}">刪除</button></td>
              </tr>
            `).join('');

        const chartRecords = [...records].reverse(); // 圖表需要時間遞增
        const labels = chartRecords.map(r => `${r.date} ${r.time}`);
        const data = chartRecords.map(r => r.bmi);
        drawChart(labels, data);
      } catch (err) {
        alert(`❌ 讀取紀錄失敗：${err.message}`);
        drawChart([], []);
      }
    }


    async function handleRecordDelete(event) {
      const target = event.target;
      if (target.classList.contains('delete-btn')) {
        const recordId = target.dataset.id;
        if (recordId && confirm("確定要刪除此紀錄？")) {
          try {
            await apiFetch(`/api/bmi-records/${recordId}`, { method: 'DELETE' });
            alert('✅ 紀錄已刪除');
            await loadBMIRecords();
          } catch (err) {
            alert(`❌ 刪除失敗：${err.message}`);
          }
        }
      }
    }

    // --- Helper Functions ---
    function getBMICategory(bmi) {
      if (bmi < 18.5) return "過輕";
      if (bmi < 24) return "正常";
      if (bmi < 27) return "過重";
      if (bmi < 30) return "輕度肥胖";
      if (bmi < 35) return "中度肥胖";
      return "重度肥胖";
    }

    function drawChart(labels, data) {
      const ctx = document.getElementById("bmiChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "BMI 趨勢",
            data,
            borderColor: "#4caf50",
            backgroundColor: "rgba(76,175,80,0.2)",
            fill: true, tension: 0.3, pointRadius: 4, pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true, // 保持您原有的設定
          scales: { y: { beginAtZero: false, suggestedMin: 10, suggestedMax: 40 } },
          plugins: {
            tooltip: {
              callbacks: { label: ctx => `${ctx.parsed.y} (${getBMICategory(ctx.parsed.y)})` }
            }
          }
        }
      });
    }
  </script>
  <script>
    const cursorImg = document.querySelector('.cursor-container img');
    let angle = 0;

    if (cursorImg) {
      cursorImg.style.transform = 'translate(-100px, -100px)';
    }

    window.addEventListener('mousemove', function (e) {
      if (cursorImg) {
        if (Math.abs(e.movementX) > 0 || Math.abs(e.movementY) > 0) {
          angle = Math.atan2(e.movementY, e.movementX) + Math.PI / 2;
        }
        cursorImg.style.transform = `translate(${e.clientX - cursorImg.width / 2}px, ${e.clientY - cursorImg.height / 2}px) rotate(${angle}rad)`;
      }
    })
  </script>
</body>

</html>
