<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>健康管家｜食物辨識</title>

  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入圖示 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    :root {
      --brand-green: #2f9e44; /* 主綠 */
      --brand-green-dark: #2b8a3e; /* 深綠 */
      --brand-green-light: #dff7e6; /* 淡綠背景 */
    }

    body {
      background: #f4f7fb;
      font-family: "Noto Sans TC", sans-serif;
    }

    /* 更新 header 字體，去掉粗體 */
    .app-header {
      background: var(--brand-green);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .brand-title {
      letter-spacing: .05em;
      font-weight: normal; /* 去除粗體 */
    }

    /* 標題和文字顏色 */
    .card-title {
      color: var(--brand-green-dark);
      font-weight: normal; /* 去除粗體 */
    }

    .dropzone {
      border: 2px dashed #8bd3a3;
      background: #f7fffa;
      border-radius: 16px;
      transition: all .2s ease;
      padding: 30px;
      text-align: center;
      cursor: pointer;
    }

    .dropzone:hover {
      background: #f1fff5;
      border-color: var(--brand-green);
    }

    .pill {
      background: var(--brand-green-light);
      color: #1e6f2f;
      border-radius: 999px;
      padding: .25rem .75rem;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--brand-green);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      padding: .75rem 1rem;
    }

    .btn-primary:hover {
      background: var(--brand-green-dark);
    }

    .stat {
      background: #f8fff9;
      border: 1px solid #e6f6ea;
      border-radius: 14px;
      padding: 10px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, .06);
      margin-bottom: 20px;
      padding: 20px;
    }

    .card-title {
      color: var(--brand-green-dark);
      font-weight: normal; /* 去除粗體 */
    }

    /* 返回主畫面按鈕 */
    #backButton {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #2196f3;
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 6px 14px rgba(33, 150, 243, .25);
    }

    #backButton:hover {
      background-color: #1976d2;
    }
  </style>
</head>

<body>

  <!-- 返回主畫面按鈕 -->
  <a href="/home" id="backButton">🔙 返回主畫面</a>

  <!-- 主內容區 -->
  <section class="max-w-6xl mx-auto px-4 mt-8">
    <div class="card p-6 md:p-8">
      <div class="flex items-center gap-3 mb-2">
        <i class="fa-solid fa-bowl-food text-2xl text-[var(--brand-green)]"></i>
        <h2 class="card-title text-2xl md:text-3xl">食物辨識</h2>
      </div>
      <p class="text-slate-600">上傳食物照片獲取食物的營養成分</p>
    </div>
  </section>

  <!-- 上傳區域 -->
  <section class="max-w-6xl mx-auto px-4 mt-6 grid md:grid-cols-2 gap-6 items-start">
    <div class="card p-6">
      <h3 class="text-lg font-bold text-slate-800 mb-3"><i class="fa-solid fa-upload me-2"></i>上傳或拖曳圖片</h3>
      <div id="dropzone" class="dropzone w-full h-56 flex flex-col items-center justify-center text-slate-600">
        <i class="fa-regular fa-image text-4xl mb-3"></i>
        <p>拖曳圖片到此，或 <span class="text-[var(--brand-green-dark)] font-semibold">點擊選擇檔案</span></p>
        <input id="fileInput" type="file" accept="image/*" class="hidden" />
      </div>

      <!-- 預覽區 -->
      <div id="previewWrap" class="mt-5 hidden">
        <p class="text-sm text-slate-600 mb-2">預覽：</p>
        <img id="previewImg" class="w-full rounded-xl border" alt="preview" />
      </div>

      <div class="flex items-center gap-3 mt-6">
        <button id="btnRecognize" class="btn-primary disabled:opacity-50" disabled>
          <i class="fa-solid fa-wand-magic-sparkles me-2"></i>辨識並查營養
        </button>
        <button id="btnClear" class="btn-ghost">清空</button>
      </div>
      <p id="tipText" class="text-xs text-slate-500 mt-3">提示：第一次使用會載入模型，可能需要 3–8 秒。</p>
    </div>

    <!-- 結果區域 -->
    <div class="card p-6">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-clipboard-list me-2"></i>結果</h3>
        <span id="predStatus" class="text-xs text-slate-500">尚未辨識</span>
      </div>

      <!-- 偵測結果顯示 -->
      <div id="candidatesWrap" class="mt-3 hidden">
        <p class="text-sm text-slate-600">AI 候選：請選擇最接近的食物名稱（可再修改）。</p>
        <div class="flex flex-wrap gap-2 mt-2" id="candidateChips"></div>
      </div>

      <!-- 搜尋結果顯示 -->
      <div id="foodListWrap" class="mt-5 hidden">
        <h4 class="font-semibold mb-2">搜尋結果</h4>
        <ul id="foodList" class="space-y-2"></ul>
      </div>

      <!-- 營養資訊顯示 -->
      <div id="nutritionWrap" class="mt-6 hidden">
        <h4 class="font-semibold mb-2">營養資訊（每份）</h4>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="stat p-4">
            <div class="text-xs text-slate-500">食物名稱</div>
            <div id="nutrFoodName" class="text-base font-bold"></div>
          </div>
          <div class="stat p-4">
            <div class="text-xs text-slate-500">熱量</div>
            <div id="nutrCal" class="text-xl font-extrabold">–</div>
            <div class="text-xs text-slate-500">kcal</div>
          </div>
          <div class="stat p-4">
            <div class="text-xs text-slate-500">蛋白質</div>
            <div id="nutrProt" class="text-xl font-extrabold">–</div>
            <div class="text-xs text-slate-500">g</div>
          </div>
          <div class="stat p-4">
            <div class="text-xs text-slate-500">碳水化合物</div>
            <div id="nutrCarb" class="text-xl font-extrabold">–</div>
            <div class="text-xs text-slate-500">g</div>
          </div>
          <div class="stat p-4">
            <div class="text-xs text-slate-500">脂肪</div>
            <div id="nutrFat" class="text-xl font-extrabold">–</div>
            <div class="text-xs text-slate-500">g</div>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>

</html>
